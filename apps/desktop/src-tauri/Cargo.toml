[package]
name = "ai-manuscript-studio"
version = "0.0.1"
description = "AI 원고실 — Tauri 2 desktop app"
authors = ["futurewave"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "ai-manuscript-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
thiserror = "1"
url = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[features]
# Tauri 2 기본 기능 토글 (기본은 빈 상태).
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = 3
strip = "symbols"
